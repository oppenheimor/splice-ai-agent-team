name: Deploy to Production

on:
  push:
    branches: [main]

# ── 全局环境 ──
env:
  REGISTRY: splice-ai-cn-shanghai.cr.volces.com
  IMAGE_NAME: splice-ai/agent-team-nextjs
  SHORT_SHA: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, agent-team]
    permissions:
      contents: read

    steps:
      # ── 1. 代码 ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. 登录镜像仓库 ──
      - name: Login to Volcengine CR
        run: |
          printf '%s' '${{ secrets.VOLCENGINE_CR_PASSWORD }}' \
            | docker login ${{ env.REGISTRY }} \
              -u '${{ secrets.VOLCENGINE_CR_USERNAME }}' \
              --password-stdin

      # ── 3. 设置 Docker Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # ── 4. 构建 & 推送 ──
      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # ── 5. 准备 SSH ──
      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.SERVER_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H '${{ secrets.SERVER_HOST }}' >> ~/.ssh/known_hosts

      # ── 6. 校验并上传 compose ──
      - name: Upload compose file
        run: |
          test -f docker-compose.yml || (echo "❌ docker-compose.yml not found" && exit 1)
          ssh -i ~/.ssh/deploy_key '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' \
            'mkdir -p /home/deploy/agent-team'
          scp -i ~/.ssh/deploy_key docker-compose.yml \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/deploy/agent-team/docker-compose.yml'

      # ── 7. 在服务器上直接写入 .env（不落本地磁盘） ──
      - name: Write production env on server
        run: |
          ssh -i ~/.ssh/deploy_key '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' <<'EOF'
            mkdir -p /home/deploy/agent-team
            cat > /home/deploy/agent-team/.env <<EOL
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY_PRODUCTION }}
          DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL_PRODUCTION }}
          DATABASE_URL=${{ secrets.DATABASE_URL_PRODUCTION }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          CREDIT_ADMIN_USERNAMES=${{ secrets.CREDIT_ADMIN_USERNAMES }}
          EOL
          EOF

      # ── 8. 部署 ──
      - name: Deploy to Server
        timeout-minutes: 60
        run: |
          ssh -i ~/.ssh/deploy_key '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' <<'REMOTE'
            set -euo pipefail
            cd /home/deploy/agent-team

            # 登录（幂等，已登录会跳过）
            printf '%s' '${{ secrets.VOLCENGINE_CR_PASSWORD }}' \
              | docker login ${{ env.REGISTRY }} \
                  -u '${{ secrets.VOLCENGINE_CR_USERNAME }}' \
                  --password-stdin || true

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans

            # 简单健康检查
            sleep 10
            docker compose -f docker-compose.yml ps | grep -i 'unhealthy' && {
              echo "❌ 容器健康检查失败"; exit 1;
            }

            docker image prune -af --filter "until=24h"
          REMOTE
