name: Deploy to Production

on:
  # 生产镜像已迁移到火山引擎托管构建；旧自托管流程仅保留手动应急入口。
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

# ── 全局环境 ──
env:
  REGISTRY: splice-ai-cn-shanghai.cr.volces.com
  IMAGE_NAME: splice-ai/agent-team-nextjs
  SHORT_SHA: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, agent-team]
    permissions:
      contents: read

    steps:
      # ── 1. 代码 ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. 登录镜像仓库 ──
      - name: Login to Volcengine CR
        run: |
          printf '%s' '${{ secrets.VOLCENGINE_CR_PASSWORD }}' \
            | docker login ${{ env.REGISTRY }} \
              -u '${{ secrets.VOLCENGINE_CR_USERNAME }}' \
              --password-stdin

      # ── 3. 构建 & 推送 ──
      - name: Build & Push
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # ── 4. 准备 SSH ──
      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.SERVER_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H '${{ secrets.SERVER_HOST }}' >> ~/.ssh/known_hosts

      # ── 5. 校验并上传部署文件 ──
      - name: Upload deployment files
        run: |
          test -f docker-compose.yml || (echo "❌ docker-compose.yml not found" && exit 1)
          test -f scripts/deploy-production.sh || (echo "❌ deploy script not found" && exit 1)
          ssh -i ~/.ssh/deploy_key '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' \
            'mkdir -p /home/deploy/agent-team'
          scp -i ~/.ssh/deploy_key docker-compose.yml scripts/deploy-production.sh \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/deploy/agent-team/'

      # ── 6. 在服务器上直接写入 .env（不落本地磁盘） ──
      - name: Write production env on server
        run: |
          ssh -i ~/.ssh/deploy_key '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' <<'EOF'
            mkdir -p /home/deploy/agent-team
            cat > /home/deploy/agent-team/.env <<EOL
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY_PRODUCTION }}
          DATABASE_URL=${{ secrets.DATABASE_URL_PRODUCTION }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          EOL
          EOF

      # ── 7. 部署 ──
      - name: Deploy to Server
        timeout-minutes: 60
        run: |
          ssh -i ~/.ssh/deploy_key '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' <<'REMOTE'
            set -euo pipefail
            cd /home/deploy/agent-team

            # 登录（幂等，已登录会跳过）
            printf '%s' '${{ secrets.VOLCENGINE_CR_PASSWORD }}' \
              | docker login ${{ env.REGISTRY }} \
                  -u '${{ secrets.VOLCENGINE_CR_USERNAME }}' \
                  --password-stdin

            bash ./deploy-production.sh \
              '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}'
          REMOTE
