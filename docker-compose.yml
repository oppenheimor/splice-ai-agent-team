services:
  nextjs:
    image: splice-ai-cn-shanghai.cr.volces.com/splice-ai/agent-team-nextjs:latest
    container_name: agent-team-nextjs
    restart: always
    networks:
      - app-network
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - AUTH_COOKIE_SECURE=false
      - EVE_NEXT_PRODUCTION_PORT=4274
    volumes:
      - wish_creator_workflow_data:/app/.workflow-data

networks:
  app-network:
    external: true

volumes:
  wish_creator_workflow_data:
