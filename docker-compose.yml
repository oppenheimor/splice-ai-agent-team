services:
  nextjs:
    image: splice-ai-cn-shanghai.cr.volces.com/splice-ai/<PROJECT_NAME>-nextjs:latest
    container_name: <PROJECT_NAME>-nextjs
    restart: always
    networks:
      - app-network
    env_file:
      - .env
    environment:
      - NODE_ENV=production

networks:
  app-network:
    external: true